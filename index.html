<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocInfo Uzbekistan</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .hide { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <!-- Asosiy Konteyner -->
    <div id="app" class="max-w-md mx-auto w-full bg-white min-h-screen shadow-xl flex flex-col relative pb-20">
        
        <!-- HEADER -->
        <header class="bg-blue-600 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-stethoscope"></i> DocInfo Uz
                </h1>
                <p class="text-xs text-blue-100" id="user-welcome">Toshkent, O'zbekiston</p>
            </div>
            <button id="auth-btn" onclick="openAuthModal()" class="bg-white text-blue-600 px-3 py-1.5 rounded-lg text-xs font-semibold shadow hover:bg-blue-50 transition">
                Kirish
            </button>
        </header>

        <!-- QIDIRUV VA FILTRLAR -->
        <div class="p-4 bg-slate-100 border-b space-y-3">
            <div class="relative">
                <i class="fa-solid fa-search absolute left-3 top-3.5 text-slate-400"></i>
                <input type="text" id="search-input" oninput="filterData()" placeholder="Shifokor, klinika yoki dorixona izlash..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
            </div>
            <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
                <button onclick="setCategory('all')" class="cat-btn bg-blue-600 text-white px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition shadow-sm">Barchasi</button>
                <button onclick="setCategory('doctor')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition">Shifokorlar</button>
                <button onclick="setCategory('clinic')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition">Klinikalar</button>
                <button onclick="setCategory('pharmacy')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition">Tibbiy buyumlar</button>
            </div>
        </div>

        <!-- MA'LUMOTLAR RO'YXATI -->
        <main class="flex-1 p-4 overflow-y-auto space-y-3" id="listings-container">
            <!-- Dinamik yuklanadi -->
            <div class="text-center py-10 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p class="text-sm">Ma'lumotlar yuklanmoqda...</p>
            </div>
        </main>

        <!-- PASTKI NAVIGATSIYA (BOTTOM NAV) -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-6 flex justify-around items-center z-45 shadow-lg">
            <button onclick="switchTab('home')" class="nav-item text-blue-600 flex flex-col items-center gap-1 text-xs font-semibold">
                <i class="fa-solid fa-house text-lg"></i> Asosiy
            </button>
            <button onclick="switchTab('favorites')" class="nav-item text-slate-400 flex flex-col items-center gap-1 text-xs font-semibold">
                <i class="fa-solid fa-bookmark text-lg"></i> Saqlangan
            </button>
            <button onclick="switchTab('profile')" class="nav-item text-slate-400 flex flex-col items-center gap-1 text-xs font-semibold">
                <i class="fa-solid fa-user text-lg"></i> Profil
            </button>
        </nav>

        <!-- TAFSILOTLAR MODALI (DETAILS MODAL) -->
        <div id="details-modal" class="fixed inset-0 bg-black/60 z-50 hide flex items-end sm:items-center justify-center p-0 sm:p-4">
            <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl animate-in fade-in duration-200">
                <div class="p-4 bg-blue-600 text-white flex justify-between items-center">
                    <h2 id="modal-title" class="font-bold text-lg">Ma'lumot</h2>
                    <button onclick="closeDetailsModal()" class="text-white text-lg p-1 hover:bg-blue-700 rounded-lg w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="modal-body" class="p-4 overflow-y-auto space-y-4 flex-1">
                    <!-- Dinamik kontent -->
                </div>
            </div>
        </div>

        <!-- AUTH MODALI (KIRISH / RO'YXATDAN O'TISH) -->
        <div id="auth-modal" class="fixed inset-0 bg-black/60 z-50 hide flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-2xl">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-lg text-slate-800" id="auth-modal-title">Tizimga kirish</h3>
                    <button onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs font-medium text-slate-600 block mb-1">Email manzil</label>
                        <input type="email" id="auth-email" placeholder="example@mail.com" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-slate-600 block mb-1">Parol</label>
                        <input type="password" id="auth-password" placeholder="******" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <button onclick="handleAuthSubmit()" id="auth-submit-btn" class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-semibold text-sm shadow hover:bg-blue-700 transition">Kirish</button>
                    <div class="text-center pt-2">
                        <button onclick="toggleAuthMode()" id="auth-toggle-text" class="text-xs text-blue-600 hover:underline">Akkauntingiz yo'qmi? Ro'yxatdan o'ting</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript Mantig'i -->
    <script>
        // Firebase konfiguratsiyasi (Namuna / O'zingizning firebase kalitingizni qo'shishingiz mumkin)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForDemoPurposesOnly12345",
            authDomain: "docinfo-uz.firebaseapp.com",
            projectId: "docinfo-uz",
            storageBucket: "docinfo-uz.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };

        // Firebase ishga tushirish (agar mavjud bo'lmasa xatolikni oldini olish uchun xavfsiz init)
        try {
            firebase.initializeApp(firebaseConfig);
        } catch (e) {
            console.warn("Firebase allaqachon ulangan yoki xatolik:", e);
        }

        const auth = firebase.auth ? firebase.auth() : null;
        const db = firebase.firestore ? firebase.firestore() : null;

        // Telegram WebApp ni sozlash
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Asosiy ma'lumotlar bazasi (Statik ma'lumotlar + Firestore bilan sinxronizatsiya)
        let itemsData = [
            {
                id: "doc_1",
                category: "doctor",
                name: "Dr. Alisher Toshmatov",
                specialty: "Kardiolog",
                district: "Yunusobod tumani",
                address: "Amir Temur ko'chasi, 108-uy",
                phone: "+998 90 123-45-67",
                rating: 4.9,
                reviewsCount: 38,
                image: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&q=80&w=200",
                description: "15 yildan ortiq tajribaga ega oliy toifali kardiolog. Yurak-qon tomir kasalliklarini davolash va profilaktikasi bo'yicha mutaxassis."
            },
            {
                id: "doc_2",
                category: "doctor",
                name: "Dr. Malika Karimova",
                specialty: "Pediatr",
                district: "Mirzo Ulug'bek tumani",
                address: "Buyuk ipak yo'li ko'chasi, 45",
                phone: "+998 93 321-65-87",
                rating: 4.8,
                reviewsCount: 24,
                image: "https://images.unsplash.com/photo-1594824813511-2895697d6a50?auto=format&fit=crop&q=80&w=200",
                description: "Bolalar kasalliklari bo'yicha mutaxassis. Chaqaloqlar parvarishi va emlash jarayonlarini nazorat qilish."
            },
            {
                id: "clinic_1",
                category: "clinic",
                name: "MedPrime Tibbiyot Markazi",
                specialty: "Ko'p tarmoqli klinika",
                district: "Chilonzor tumani",
                address: "Qatortol ko'chasi, 28",
                phone: "+998 71 200-11-22",
                rating: 4.7,
                reviewsCount: 56,
                image: "https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&q=80&w=200",
                description: "Zamonaviy UZI, MRT diagnostika markazi va malakali shifokorlar qabuli."
            },
            {
                id: "pharm_1",
                category: "pharmacy",
                name: "Omad Tibbiy Buyumlar Do'koni",
                specialty: "Ortopediya va reabilitatsiya",
                district: "Shayxontohur tumani",
                address: "Navoiy ko'chasi, 15",
                phone: "+998 71 244-55-66",
                rating: 4.9,
                reviewsCount: 19,
                image: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&q=80&w=200",
                description: "Barcha turdagi tonometrlar, nogironlar aravachalari, ortopedik koresetlar va tibbiy sarf materiallari."
            }
        ];

        let currentCategory = 'all';
        let currentTab = 'home';
        let favorites = JSON.parse(localStorage.getItem('docinfo_favs')) || [];
        let currentUser = null;
        let isRegistering = false;

        // Ilovani ishga tushirish
        window.addEventListener('DOMContentLoaded', () => {
            initAuth();
            renderListings();
            checkTelegramUser();
        });

        function checkTelegramUser() {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                let user = tg.initDataUnsafe.user;
                document.getElementById('user-welcome').innerText = `Salom, ${user.first_name}!`;
            }
        }

        function initAuth() {
            if (auth) {
                auth.onAuthStateChanged(user => {
                    currentUser = user;
                    const authBtn = document.getElementById('auth-btn');
                    if (user) {
                        authBtn.innerText = "Chiqish";
                        authBtn.onclick = logoutUser;
                    } else {
                        authBtn.innerText = "Kirish";
                        authBtn.onclick = openAuthModal;
                    }
                });
            }
        }

        // Kategoriya o'zgartirish
        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-white text-slate-600 border border-slate-200 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition";
            });
            event.target.className = "cat-btn bg-blue-600 text-white px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition shadow-sm";
            renderListings();
        }

        // Ma'lumotlarni chiqarish
        function renderListings() {
            const container = document.getElementById('listings-container');
            container.innerHTML = '';

            let dataToRender = itemsData;

            if (currentTab === 'favorites') {
                dataToRender = itemsData.filter(item => favorites.includes(item.id));
                if (dataToRender.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-16 text-slate-400 space-y-2">
                            <i class="fa-regular fa-bookmark text-3xl"></i>
                            <p class="text-sm">Saqlangan elementlar yo'q</p>
                        </div>
                    `;
                    return;
                }
            } else if (currentTab === 'profile') {
                renderProfileTab(container);
                return;
            }

            // Filtr turi va qidiruv bo'yicha saralash
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            dataToRender = dataToRender.filter(item => {
                const matchCat = currentCategory === 'all' || item.category === currentCategory;
                const matchSearch = item.name.toLowerCase().includes(searchQuery) || 
                                    item.specialty.toLowerCase().includes(searchQuery) || 
                                    item.district.toLowerCase().includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (dataToRender.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-400 space-y-2">
                        <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
                        <p class="text-sm">Hech narsa topilmadi</p>
                    </div>
                `;
                return;
            }

            dataToRender.forEach(item => {
                const isFav = favorites.includes(item.id);
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl p-3.5 shadow-sm hover:shadow-md transition flex gap-3.5 items-center cursor-pointer relative";
                card.onclick = () => openDetailsModal(item.id);
                card.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" class="w-16 h-16 rounded-xl object-cover bg-slate-100">
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-sm text-slate-800 truncate">${item.name}</h3>
                            <button onclick="event.stopPropagation(); toggleFavorite('${item.id}')" class="text-slate-300 hover:text-red-500 text-base">
                                <i class="${isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-bookmark"></i>
                            </button>
                        </div>
                        <p class="text-xs text-blue-600 font-medium">${item.specialty}</p>
                        <p class="text-xs text-slate-500 mt-1 flex items-center gap-1">
                            <i class="fa-solid fa-location-dot text-[10px]"></i> ${item.district}
                        </p>
                        <div class="flex items-center gap-1 mt-2 text-xs font-semibold text-amber-500">
                            <i class="fa-solid fa-star"></i> ${item.rating} <span class="text-slate-400 font-normal">(${item.reviewsCount} sharh)</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterData() {
            renderListings();
        }

        // Tablar bo'yicha almashish
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('nav button').forEach(btn => {
                btn.className = "nav-item text-slate-400 flex flex-col items-center gap-1 text-xs font-semibold";
            });
            event.currentTarget.className = "nav-item text-blue-600 flex flex-col items-center gap-1 text-xs font-semibold";
            renderListings();
        }

        function renderProfileTab(container) {
            container.innerHTML = `
                <div class="bg-white border rounded-2xl p-5 shadow-sm space-y-4">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-xl font-bold">
                            ${currentUser ? currentUser.email[0].toUpperCase() : 'U'}
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-800">${currentUser ? currentUser.email : 'Mehmon foydalanuvchi'}</h3>
                            <p class="text-xs text-slate-500">DocInfo Uz foydalanuvchisi</p>
                        </div>
                    </div>
                    <hr class="border-slate-100">
                    <div class="space-y-2 text-sm text-slate-600">
                        <p><i class="fa-solid fa-shield-halved text-blue-600 w-6"></i> Xavfsiz Telegram WebApp</p>
                        <p><i class="fa-solid fa-location-crosshairs text-blue-600 w-6"></i> Toshkent shahar va tumanlari</p>
                    </div>
                    ${!currentUser ? '<button onclick="openAuthModal()" class="w-full bg-blue-600 text-white py-2 rounded-xl text-sm font-semibold shadow">Tizimga kirish</button>' : '<button onclick="logoutUser()" class="w-full bg-slate-100 text-red-600 py-2 rounded-xl text-sm font-semibold">Chiqish</button>'}
                </div>
            `;
        }

        // Sevimlilarga qo'shish / O'chirish
        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('docinfo_favs', JSON.stringify(favorites));
            renderListings();
        }

        // Tafsilotlar modalini ochish
        function openDetailsModal(id) {
            const item = itemsData.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modal-title').innerText = item.name;
            document.getElementById('modal-body').innerHTML = `
                <img src="${item.image}" alt="${item.name}" class="w-full h-48 rounded-xl object-cover bg-slate-100">
                <div class="space-y-2">
                    <span class="bg-blue-50 text-blue-600 px-2.5 py-1 rounded-lg text-xs font-semibold inline-block">${item.specialty}</span>
                    <h3 class="font-bold text-lg text-slate-800">${item.name}</h3>
                    <p class="text-xs text-slate-600 leading-relaxed">${item.description}</p>
                </div>
                <div class="bg-slate-50 p-3.5 rounded-xl space-y-2 text-xs">
                    <div class="flex items-center gap-2 text-slate-700">
                        <i class="fa-solid fa-location-dot text-blue-600 w-4"></i>
                        <span>${item.address}, ${item.district}</span>
                    </div>
                    <div class="flex items-center gap-2 text-slate-700">
                        <i class="fa-solid fa-phone text-blue-600 w-4"></i>
                        <a href="tel:${item.phone}" class="font-semibold text-blue-600">${item.phone}</a>
                    </div>
                </div>
                <div>
                    <h4 class="font-bold text-sm text-slate-800 mb-2">Sharh qoldirish</h4>
                    <div class="space-y-2">
                        <textarea id="review-text" placeholder="O'z fikringizni yozing..." class="w-full p-2.5 border rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                        <button onclick="submitReview('${item.id}')" class="w-full bg-blue-600 text-white py-2 rounded-xl text-xs font-semibold shadow">Sharh yuborish</button>
                    </div>
                </div>
            `;
            document.getElementById('details-modal').classList.remove('hide');
        }

        function closeDetailsModal() {
            document.getElementById('details-modal').classList.add('hide');
        }

        // Sharh qo'shish funksiyasi
        function submitReview(id) {
            const text = document.getElementById('review-text').value;
            if (!text.trim()) {
                alert("Iltimos, sharh matnini kiriting!");
                return;
            }
            alert("Sharhingiz muvaffaqiyatli qo'shildi!");
            document.getElementById('review-text').value = '';
        }

        // Auth Modal funksiyalari
        function openAuthModal() {
            document.getElementById('auth-modal').classList.remove('hide');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hide');
        }

        function toggleAuthMode() {
            isRegistering = !isRegistering;
            document.getElementById('auth-modal-title').innerText = isRegistering ? "Ro'yxatdan o'tish" : "Tizimga kirish";
            document.getElementById('auth-submit-btn').innerText = isRegistering ? "Ro'yxatdan o'tish" : "Kirish";
            document.getElementById('auth-toggle-text').innerText = isRegistering ? "Akkauntingiz bormi? Tizimga kiring" : "Akkauntingiz yo'qmi? Ro'yxatdan o'ting";
        }

        async function handleAuthSubmit() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (!email || !password) {
                alert("Barcha maydonlarni to'ldiring!");
                return;
            }

            if (!auth) {
                alert("Autentifikatsiya xizmati ulanmagan (Demo rejim).");
                closeAuthModal();
                return;
            }

            try {
                if (isRegistering) {
                    await auth.createUserWithEmailAndPassword(email, password);
                    alert("Muvaffaqiyatli ro'yxatdan o'tdingiz!");
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                    alert("Xush kelibsiz!");
                }
                closeAuthModal();
            } catch (error) {
                alert("Xatolik: " + error.message);
            }
        }

        async function logoutUser() {
            if (auth) {
                await auth.signOut();
                alert("Tizimdan chiqildi.");
                renderListings();
            }
        }
    </script>
</body>
</html>
