<!DOCTYPE html>
<html lang="uz" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShifoTop - Tibbiy Xizmatlar Platformasi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-300 min-h-screen pb-20">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-blue-500/20">
                <i class="fa-solid fa-star-of-life"></i>
            </div>
            <div>
                <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">ShifoTop</span>
                <p class="text-[10px] text-slate-400 dark:text-slate-400">Salom, Mamaniyozov Odil!</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Theme Toggle -->
            <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 transition">
                <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
            </button>
            <!-- Auth / Profile Button -->
            <button onclick="openAuthModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-semibold shadow-sm transition">
                Kirish
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Search Bar -->
        <div class="space-y-2">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Shifokor, klinika yoki dorixona izlash..." class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-10 pr-4 py-3 text-xs focus:outline-none focus:border-blue-500 transition shadow-sm">
            </div>
            <div class="relative">
                <select id="regionFilter" onchange="handleSearch()" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500 transition shadow-sm appearance-none text-slate-600 dark:text-slate-300">
                    <option value="">Barcha hududlar</option>
                    <option value="Toshkent">Toshkent sh.</option>
                    <option value="Samarqand">Samarqand sh.</option>
                    <option value="Buxoro">Buxoro sh.</option>
                    <option value="Farg'ona">Farg'ona sh.</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-4 top-3.5 text-slate-400 text-xs pointer-events-none"></i>
            </div>
        </div>

        <!-- Categories / Filters -->
        <div class="flex space-x-2 overflow-x-auto pb-1 no-scrollbar">
            <button onclick="filterCategory('all')" class="cat-btn active bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap shadow-sm transition">Barchasi</button>
            <button onclick="filterCategory('doctor')" class="cat-btn bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition">Shifokorlar</button>
            <button onclick="filterCategory('hospital')" class="cat-btn bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition">Klinikalar</button>
            <button onclick="filterCategory('pharmacy')" class="cat-btn bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition">Dorixonalar</button>
        </div>

        <!-- Doctors Section -->
        <section id="doctorsSection" class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-800 dark:text-white text-sm flex items-center">
                    <i class="fa-solid fa-user-doctor text-blue-500 mr-2"></i>Shifokorlar
                </h3>
                <button onclick="toggleShowAll('doctors')" id="doctorsToggleBtn" class="text-xs text-blue-600 dark:text-blue-400 font-semibold hover:underline">Barchasi</button>
            </div>
            <div id="doctorsContainer" class="grid grid-cols-1 gap-3"></div>
        </section>

        <!-- Hospitals Section -->
        <section id="hospitalsSection" class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-800 dark:text-white text-sm flex items-center">
                    <i class="fa-solid fa-hospital text-rose-500 mr-2"></i>Klinikalar va Shifoxonalar
                </h3>
                <button onclick="toggleShowAll('hospitals')" id="hospitalsToggleBtn" class="text-xs text-blue-600 dark:text-blue-400 font-semibold hover:underline">Barchasi</button>
            </div>
            <div id="hospitalsContainer" class="grid grid-cols-1 gap-3"></div>
        </section>

        <!-- Pharmacies Section -->
        <section id="pharmaciesSection" class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-800 dark:text-white text-sm flex items-center">
                    <i class="fa-solid fa-pills text-emerald-500 mr-2"></i>Dorixonalar (24/7)
                </h3>
                <button onclick="toggleShowAll('pharmacies')" id="pharmaciesToggleBtn" class="text-xs text-blue-600 dark:text-blue-400 font-semibold hover:underline">Barchasi</button>
            </div>
            <div id="pharmaciesContainer" class="grid grid-cols-1 gap-3"></div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 dark:border-slate-800 mt-10">
        &copy; 2026 ShifoTop. Barcha huquqlar himoyalangan.
    </footer>

    <!-- Booking / Order Modal -->
    <div id="bookingModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                <h3 id="modalTitle" class="font-bold text-sm text-slate-800 dark:text-white">Qabulga yozilish</h3>
                <button onclick="closeBookingModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="bookingForm" onsubmit="submitBooking(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-slate-600 dark:text-slate-300 mb-1">F.I.Sh</label>
                    <input type="text" id="bookName" value="Mamaniyozov Odil" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block font-medium text-slate-600 dark:text-slate-300 mb-1">Telefon raqam</label>
                    <input type="tel" id="bookPhone" value="+998 90 123 45 67" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
                </div>
                <div id="dateFieldWrapper">
                    <label class="block font-medium text-slate-600 dark:text-slate-300 mb-1">Sana va vaqt</label>
                    <input type="datetime-local" id="bookDate" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-md shadow-blue-500/20">Tasdiqlash</button>
            </form>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                <h3 class="font-bold text-sm text-slate-800 dark:text-white">Tizimga kirish</h3>
                <button onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <button onclick="requestTelegramContact()" class="w-full bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center space-x-2 transition">
                <i class="fa-brands fa-telegram text-base"></i>
                <span>Telegram orqali kirish</span>
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const doctors = [
            { id: 1, name: "Dr. Alisher Karimov", specialty: "KARDIOLOG", experience: "12 yil", location: "Toshkent", address: "Kichik halqa yo'li 10", price: "100 000 so'm", phone: "+998 90 123 45 67", rating: "4.9", image: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=400" },
            { id: 2, name: "Dr. Malika Umarova", specialty: "PEDIATR", experience: "8 yil", location: "Samarqand", address: "Registon ko'chasi 5", price: "80 000 so'm", phone: "+998 91 555 33 22", rating: "4.8", image: "https://images.unsplash.com/photo-1594824813587-873523d42c3d?w=400" },
            { id: 3, name: "Dr. Jamshid Saidov", specialty: "NEVROPATOLOG", experience: "15 yil", location: "Buxoro", address: "Al-Buxoriy ko'chasi 12", price: "120 000 so'm", phone: "+998 93 444 11 00", rating: "4.7", image: "https://images.unsplash.com/photo-1537368910025-700350fe46c7?w=400" },
            { id: 4, name: "Dr. Zilola Rahimova", specialty: "STOMATOLOG", experience: "10 yil", location: "Toshkent", address: "Amir Temur shoh ko'chasi 24", price: "150 000 so'm", phone: "+998 99 888 77 66", rating: "5.0", image: "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=400" },
            { id: 5, name: "Dr. Bobur Tursunov", specialty: "JARROH", experience: "14 yil", location: "Farg'ona", address: "Mustaqillik ko'chasi 8", price: "200 000 so'm", phone: "+998 90 777 55 44", rating: "4.6", image: "https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?w=400" },
            { id: 6, name: "Dr. Nodira Azimova", specialty: "DERMATOLOG", experience: "7 yil", location: "Toshkent", address: "Bunyodkor ko'chasi 15", price: "90 000 so'm", phone: "+998 94 333 22 11", rating: "4.8", image: "https://images.unsplash.com/photo-1594824813587-873523d42c3d?w=400" }
        ];

        const hospitals = [
            { id: 1, name: "Shifo Med Clinic", location: "Toshkent", address: "Chilonzor tumani, 9-mavze", rating: "4.9", phone: "+998 71 200 11 22", image: "https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=400" },
            { id: 2, name: "Cardio Plus Markazi", location: "Samarqand", address: "Registon ko'chasi 18", rating: "4.8", phone: "+998 66 233 44 55", image: "https://images.unsplash.com/photo-1586773860418-d37222d8fce3?w=400" },
            { id: 3, name: "Elite Stomatologiya", location: "Buxoro", address: "Markaziy ko'cha 3", rating: "4.7", phone: "+998 65 221 11 00", image: "https://images.unsplash.com/photo-1629909613654-28e377c37b09?w=400" },
            { id: 4, name: "Avicenna Hospital", location: "Toshkent", address: "Yunusobod tumani, 4-kvartal", rating: "5.0", phone: "+998 71 299 88 77", image: "https://images.unsplash.com/photo-1516549655169-df83a0774514?w=400" },
            { id: 5, name: "Grand Medical", location: "Farg'ona", address: "Al-Farg'oniy ko'chasi 45", rating: "4.6", phone: "+998 73 244 55 66", image: "https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?w=400" }
        ];

        const pharmacies = [
            { id: 1, name: "Oxymed Dorixonasi", location: "Toshkent", address: "Navoiy ko'chasi 15", phone: "+998 71 207 00 00", hours: "24/7 ochiq", rating: "4.9", image: "https://images.unsplash.com/photo-1587854692152-cbe660dbde88?w=400" },
            { id: 2, name: "D фарма Dorixona", location: "Samarqand", address: "Rudakiy ko'chasi 40", phone: "+998 66 230 11 22", hours: "24/7 ochiq", rating: "4.8", image: "https://images.unsplash.com/photo-1576602976047-174e57a47881?w=400" },
            { id: 3, name: "Ate Rewiz Dorixona", location: "Buxoro", address: "Iбн Сино ko'chasi 8", phone: "+998 65 224 55 44", hours: "08:00 - 22:00", rating: "4.7", image: "https://images.unsplash.com/photo-1631549916768-4119b2e5f926?w=400" },
            { id: 4, name: "Grand Pharm", location: "Toshkent", address: "Farg'ona yo'li 62", phone: "+998 71 231 44 55", hours: "24/7 ochiq", rating: "4.9", image: "https://images.unsplash.com/photo-1587854692152-cbe660dbde88?w=400" }
        ];

        let showAllDoctorsFlag = false;
        let showAllHospitalsFlag = false;
        let showAllPharmaciesFlag = false;

        function renderDoctors(data = doctors) {
            const container = document.getElementById('doctorsContainer');
            const itemsToRender = showAllDoctorsFlag ? data : data.slice(0, 4);
            
            if(itemsToRender.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Shifokor topilmadi</p>`;
                return;
            }

            container.innerHTML = itemsToRender.map(doc => `
                <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden transition">
                    <div class="relative h-44">
                        <img src="${doc.image}" alt="${doc.name}" class="w-full h-full object-cover">
                        <div class="absolute top-3 left-3 bg-blue-600 text-white text-[10px] font-bold px-3 py-1 rounded-full shadow">${doc.location}</div>
                        <div class="absolute top-3 right-3 bg-white/90 dark:bg-slate-800/95 backdrop-blur-sm text-slate-800 dark:text-white text-[11px] font-bold px-2.5 py-1 rounded-full shadow flex items-center space-x-1">
                            <i class="fa-solid fa-star text-amber-400"></i>
                            <span>${doc.rating}</span>
                        </div>
                    </div>
                    <div class="p-4 space-y-2.5">
                        <div>
                            <span class="text-[10px] font-bold tracking-wider text-blue-600 dark:text-blue-400">${doc.specialty}</span>
                            <h4 class="font-bold text-slate-800 dark:text-white text-sm mt-0.5">${doc.name}</h4>
                        </div>
                        <div class="space-y-1 text-xs text-slate-500 dark:text-slate-400">
                            <p><i class="fa-solid fa-briefcase text-blue-500 mr-1.5 w-4"></i>Tajriba: ${doc.experience}</p>
                            <p><i class="fa-solid fa-location-dot text-rose-500 mr-1.5 w-4"></i>Manzil: ${doc.address}</p>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700">
                            <a href="tel:${doc.phone}" class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center space-x-1.5">
                                <i class="fa-solid fa-phone text-emerald-500"></i>
                                <span>${doc.phone}</span>
                            </a>
                            <button onclick="openBooking('doctor', ${doc.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-semibold transition shadow-md shadow-blue-500/20 flex items-center space-x-1.5">
                                <i class="fa-solid fa-calendar-check"></i>
                                <span>Band qilish</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('doctorsToggleBtn').innerText = showAllDoctorsFlag ? "Qisqartirish" : "Barchasi (" + data.length + ")";
        }

        function renderHospitals(data = hospitals) {
            const container = document.getElementById('hospitalsContainer');
            const itemsToRender = showAllHospitalsFlag ? data : data.slice(0, 4);

            if(itemsToRender.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Klinika topilmadi</p>`;
                return;
            }

            container.innerHTML = itemsToRender.map(hosp => `
                <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden transition">
                    <div class="relative h-36">
                        <img src="${hosp.image}" alt="${hosp.name}" class="w-full h-full object-cover">
                        <div class="absolute top-3 left-3 bg-rose-500 text-white text-[10px] font-bold px-3 py-1 rounded-full shadow">${hosp.location}</div>
                        <div class="absolute top-3 right-3 bg-white/90 dark:bg-slate-800/95 backdrop-blur-sm text-slate-800 dark:text-white text-[11px] font-bold px-2.5 py-1 rounded-full shadow flex items-center space-x-1">
                            <i class="fa-solid fa-star text-amber-400"></i>
                            <span>${hosp.rating}</span>
                        </div>
                    </div>
                    <div class="p-4 space-y-2.5">
                        <h4 class="font-bold text-slate-800 dark:text-white text-sm">${hosp.name}</h4>
                        <div class="space-y-1 text-xs text-slate-500 dark:text-slate-400">
                            <p><i class="fa-solid fa-location-dot text-rose-500 mr-1.5 w-4"></i>Manzil: ${hosp.address}</p>
                            <p><i class="fa-solid fa-phone text-emerald-500 mr-1.5 w-4"></i>Tel: ${hosp.phone}</p>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700">
                            <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400">Ishonchli klinika</span>
                            <button onclick="openBooking('hospital', ${hosp.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-semibold transition shadow-md shadow-blue-500/20">Qabulga yozilish</button>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('hospitalsToggleBtn').innerText = showAllHospitalsFlag ? "Qisqartirish" : "Barchasi (" + data.length + ")";
        }

        function renderPharmacies(data = pharmacies) {
            const container = document.getElementById('pharmaciesContainer');
            const itemsToRender = showAllPharmaciesFlag ? data : data.slice(0, 4);

            if(itemsToRender.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Dorixona topilmadi</p>`;
                return;
            }

            container.innerHTML = itemsToRender.map(pharm => `
                <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden transition">
                    <div class="relative h-36">
                        <img src="${pharm.image}" alt="${pharm.name}" class="w-full h-full object-cover">
                        <div class="absolute top-3 left-3 bg-emerald-600 text-white text-[10px] font-bold px-3 py-1 rounded-full shadow">${pharm.location}</div>
                        <div class="absolute top-3 right-3 bg-white/90 dark:bg-slate-800/95 backdrop-blur-sm text-slate-800 dark:text-white text-[11px] font-bold px-2.5 py-1 rounded-full shadow flex items-center space-x-1">
                            <i class="fa-solid fa-clock text-blue-500"></i>
                            <span>${pharm.hours}</span>
                        </div>
                    </div>
                    <div class="p-4 space-y-2.5">
                        <h4 class="font-bold text-slate-800 dark:text-white text-sm">${pharm.name}</h4>
                        <div class="space-y-1 text-xs text-slate-500 dark:text-slate-400">
                            <p><i class="fa-solid fa-location-dot text-rose-500 mr-1.5 w-4"></i>Manzil: ${pharm.address}</p>
                            <p><i class="fa-solid fa-phone text-emerald-500 mr-1.5 w-4"></i>Tel: ${pharm.phone}</p>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700">
                            <a href="tel:${pharm.phone}" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center space-x-1">
                                <i class="fa-solid fa-phone text-emerald-500"></i>
                                <span>Bog'lanish</span>
                            </a>
                            <button onclick="openBooking('pharmacy', ${pharm.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-semibold transition shadow-md shadow-emerald-500/20">Dori buyurtma</button>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('pharmaciesToggleBtn').innerText = showAllPharmaciesFlag ? "Qisqartirish" : "Barchasi (" + data.length + ")";
        }

        function toggleShowAll(type) {
            if (type === 'doctors') {
                showAllDoctorsFlag = !showAllDoctorsFlag;
                renderDoctors();
            } else if (type === 'hospitals') {
                showAllHospitalsFlag = !showAllHospitalsFlag;
                renderHospitals();
            } else if (type === 'pharmacies') {
                showAllPharmaciesFlag = !showAllPharmaciesFlag;
                renderPharmacies();
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const region = document.getElementById('regionFilter').value;

            const filteredDocs = doctors.filter(d => {
                const matchesQuery = d.name.toLowerCase().includes(query) || d.specialty.toLowerCase().includes(query);
                const matchesRegion = region === "" || d.location.toLowerCase() === region.toLowerCase();
                return matchesQuery && matchesRegion;
            });

            const filteredHosps = hospitals.filter(h => {
                const matchesQuery = h.name.toLowerCase().includes(query) || h.address.toLowerCase().includes(query);
                const matchesRegion = region === "" || h.location.toLowerCase() === region.toLowerCase();
                return matchesQuery && matchesRegion;
            });

            const filteredPharms = pharmacies.filter(p => {
                const matchesQuery = p.name.toLowerCase().includes(query) || p.address.toLowerCase().includes(query);
                const matchesRegion = region === "" || p.location.toLowerCase() === region.toLowerCase();
                return matchesQuery && matchesRegion;
            });

            renderDoctors(filteredDocs);
            renderHospitals(filteredHosps);
            renderPharmacies(filteredPharms);
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
                btn.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300', 'border', 'border-slate-200', 'dark:border-slate-700');
            });
            event.target.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
            event.target.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300', 'border');

            const docSec = document.getElementById('doctorsSection');
            const hospSec = document.getElementById('hospitalsSection');
            const pharmSec = document.getElementById('pharmaciesSection');

            docSec.style.display = (cat === 'all' || cat === 'doctor') ? 'block' : 'none';
            hospSec.style.display = (cat === 'all' || cat === 'hospital') ? 'block' : 'none';
            pharmSec.style.display = (cat === 'all' || cat === 'pharmacy') ? 'block' : 'none';
        }

        function openBooking(type, id) {
            const modalTitle = document.getElementById('modalTitle');
            const dateWrapper = document.getElementById('dateFieldWrapper');
            
            if (type === 'pharmacy') {
                modalTitle.innerText = "Dorixonaga buyurtma berish";
                dateWrapper.style.display = 'none';
            } else {
                modalTitle.innerText = "Qabulga yozilish";
                dateWrapper.style.display = 'block';
            }
            document.getElementById('bookingModal').classList.remove('hidden');
        }

        function closeBookingModal() {
            document.getElementById('bookingModal').classList.add('hidden');
        }

        function submitBooking(e) {
            e.preventDefault();
            alert("Muvaffaqiyatli bajarildi!");
            closeBookingModal();
        }

        function openAuthModal() {
            document.getElementById('authModal').classList.remove('hidden');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.add('hidden');
        }

        function requestTelegramContact() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                if (tg.version >= "6.9" && tg.requestContact) {
                    tg.requestContact((sent) => {
                        if (sent) alert("Kontakt muvaffaqiyatli ulandi!");
                    });
                } else {
                    alert("Telegram WebApp orqali kontaktni tasdiqlang.");
                }
            } else {
                alert("Iltimos, ilovani Telegram ichida oching.");
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "fa-solid fa-moon text-sm";
            } else {
                html.classList.add('dark');
                icon.className = "fa-solid fa-sun text-sm";
            }
        }

        window.onload = () => {
            renderDoctors();
            renderHospitals();
            renderPharmacies();
        };
    </script>
</body>
</html>
