<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocInfo Tashkent</title>
    <!-- PWA & iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DocInfo">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/stethoscope.png">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
      \"name\": \"DocInfo Tashkent\",
      \"short_name\": \"DocInfo\",
      \"start_url\": \"./\",
      \"display\": \"standalone\",
      \"background_color\": \"#f8fafc\",
      \"theme_color\": \"#0284c7\",
      \"icons\": [{
        \"src\": \"https://img.icons8.com/color/512/stethoscope.png\",
        \"sizes\": \"512x512\",
        \"type\": \"image/png\"
      }]
    }">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

    <!-- Header / Banner -->
    <header class="bg-gradient-to-r from-sky-600 to-blue-700 text-white p-4 shadow-md sticky top-0 z-30">
        <div class="flex items-center justify-between mb-3">
            <div>
                <h1 class="text-xl font-bold tracking-tight">DocInfo Tashkent</h1>
                <p id="appSubtitle" class="text-xs text-sky-100">Shifokorlar va klinikalar katalogi</p>
            </div>
            <!-- Language Switcher with sliding background -->
            <div class="relative flex items-center bg-black/20 p-1 rounded-xl backdrop-blur-sm">
                <div id="langIndicator" class="absolute h-7 w-9 bg-white rounded-lg shadow-sm transition-all duration-300 ease-in-out left-1"></div>
                <button onclick="changeLang('uz')" id="btnUz" class="relative z-10 w-9 py-1 text-xs font-bold text-sky-700 text-center transition">UZ</button>
                <button onclick="changeLang('ru')" id="btnRu" class="relative z-10 w-9 py-1 text-xs font-bold text-white text-center transition">RU</button>
                <button onclick="changeLang('en')" id="btnEn" class="relative z-10 w-9 py-1 text-xs font-bold text-white text-center transition">EN</button>
            </div>
        </div>

        <!-- Search Box -->
        <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </span>
            <input type="text" id="searchInput" placeholder="Shifokor yoki mutaxassislikni izlash..." class="w-full pl-10 pr-4 py-2.5 bg-white text-slate-800 text-sm rounded-xl focus:outline-none shadow-sm placeholder:text-slate-400">
        </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="bg-white px-4 py-3 shadow-xs border-b border-slate-100 sticky top-[120px] z-20">
        <div class="flex space-x-2">
            <button id="tabDoctors" onclick="switchTab('doctors')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-sky-600 text-white transition shadow-sm">Shifokorlar</button>
            <button id="tabClinics" onclick="switchTab('clinics')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-slate-100 text-slate-600 transition">Shifoxonalar</button>
        </div>
    </div>

    <!-- Category Filters -->
    <div id="categoryFilters" class="bg-white py-2 px-4 border-b border-slate-100 overflow-x-auto hide-scrollbar flex space-x-2 sticky top-[173px] z-10">
        <button onclick="filterCategory('all')" class="cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-slate-900 text-white whitespace-nowrap transition" data-cat="all">Barchasi</button>
        <button onclick="filterCategory('Stomatolog')" class="cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition" data-cat="Stomatolog">Stomatolog</button>
        <button onclick="filterCategory('Kardiolog')" class="cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition" data-cat="Kardiolog">Kardiolog</button>
        <button onclick="filterCategory('Terapevt')" class="cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition" data-cat="Terapevt">Terapevt</button>
        <button onclick="filterCategory('Xirurg')" class="cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition" data-cat="Xirurg">Xirurg</button>
    </div>

    <!-- Main Content Container -->
    <main class="p-4 max-w-xl mx-auto">
        <div id="loading" class="text-center py-12 text-slate-400 text-sm">Ma'lumotlar yuklanmoqda...</div>
        <div id="contentList" class="space-y-3"></div>
    </main>

    <!-- Detail Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl transform transition-transform">
            <div class="flex justify-between items-start mb-4">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800"></h3>
                <button onclick="closeModal()" class="p-1 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="modalBody" class="space-y-4 text-sm"></div>
        </div>
    </div>

        let currentLang = 'uz';

        function changeLang(lang) {
            currentLang = lang;
            const indicator = document.getElementById('langIndicator');
            if (lang === 'uz') indicator.style.left = '4px';
            else if (lang === 'ru') indicator.style.left = '40px';
            else if (lang === 'en') indicator.style.left = '76px';

            ['uz', 'ru', 'en'].forEach(l => {
                const btn = document.getElementById('btn' + l.toUpperCase());
                if (btn) {
                    if (l === lang) {
                        btn.className = "relative z-10 w-9 py-1 text-xs font-bold text-sky-700 text-center transition";
                    } else {
                        btn.className = "relative z-10 w-9 py-1 text-xs font-bold text-white text-center transition";
                    }
                }
            });

            const t = translations[currentLang];
            document.getElementById('appSubtitle').textContent = t.subtitle;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('tabDoctors').textContent = t.tabDoctors;
            document.getElementById('tabClinics').textContent = t.tabClinics;
            
            const allBtn = document.querySelector('.cat-btn[data-cat="all"]');
            if (allBtn) allBtn.textContent = t.allCat;

            renderContent();
        }

        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const mockDoctors = [

        const mockClinics = [

        let currentTab = 'doctors';
        let currentCategory = 'all';

        function renderContent() {
            const t = translations[currentLang];
            const listEl = document.getElementById('contentList');
            document.getElementById('loading').style.display = 'none';
            listEl.innerHTML = '';

            const query = document.getElementById('searchInput').value.toLowerCase();

            if (currentTab === 'doctors') {
                let filtered = mockDoctors;
                if (currentCategory !== 'all') {
                    filtered = mockDoctors.filter(d => d.category === currentCategory);
                }
                if (query) {
                    filtered = filtered.filter(d => d.name.toLowerCase().includes(query) || d.specialization.toLowerCase().includes(query) || d.clinic.toLowerCase().includes(query));
                }

                if (filtered.length === 0) {
                    listEl.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">${t.notFound}</div>`;
                    return;
                }

                filtered.forEach(doc => {
                    let card = document.createElement('div');
                    card.className = 'bg-white p-4 rounded-2xl shadow-xs border border-slate-100 active:scale-[0.99] transition cursor-pointer flex space-x-3 items-center';
                    card.onclick = () => openDoctorDetail(doc);
                    let displayPrice = (doc.price === 0) ? t.free : doc.price;
                    card.innerHTML = `
                        <img src="${doc.photo}" class="w-16 h-16 rounded-xl object-cover shrink-0 bg-sky-100" alt="${doc.name}">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between">
                                <h4 class="font-bold text-slate-800 text-sm truncate">${doc.name}</h4>
                                <span class="flex items-center text-amber-500 text-xs font-semibold bg-amber-50 px-2 py-0.5 rounded-full">★ ${doc.rating}</span>
                            </div>
                            <p class="text-xs text-sky-600 font-medium mt-0.5">${doc.subSpecialization} • ${doc.experience} ${t.experience}</p>
                            <div class="mt-2 pt-1.5 border-t border-slate-50 flex items-center justify-between text-xs">
                                <span class="text-slate-500 truncate mr-2">📍 ${doc.clinic}</span>
                                <span class="font-bold text-emerald-600 shrink-0">${displayPrice}</span>
                            </div>
                        </div>
                    `;
                    listEl.appendChild(card);
                });
            } else {
                let filteredClinics = mockClinics;
                if (query) {
                    filteredClinics = filteredClinics.filter(c => c.name.toLowerCase().includes(query) || c.address.toLowerCase().includes(query));
                }

                if (filteredClinics.length === 0) {
                    listEl.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">${t.notFound}</div>`;
                    return;
                }

                filteredClinics.forEach(clinic => {
                    let card = document.createElement('div');
                    card.className = 'bg-white rounded-2xl shadow-xs border border-slate-100 overflow-hidden cursor-pointer active:scale-[0.99] transition';
                    card.onclick = () => openClinicDetail(clinic);
                    card.innerHTML = `
                        <img src="${clinic.photo}" class="w-full h-36 object-cover bg-slate-100" alt="${clinic.name}">
                        <div class="p-4">
                            <h4 class="font-bold text-slate-800 text-sm">${clinic.name}</h4>
                            <p class="text-xs text-slate-500 mt-1">📍 ${clinic.address}</p>
                            <p class="text-xs text-slate-500 mt-0.5">🕒 ${t.hoursLabel}: ${clinic.hours}</p>
                            <div class="mt-3 pt-2 border-t border-slate-50 flex justify-between items-center text-xs">
                                <span class="text-sky-600 font-medium">📞 ${clinic.phone}</span>
                                <span class="text-sky-700 font-bold bg-sky-50 px-2.5 py-1 rounded-lg">Batafsil →</span>
                            </div>
                        </div>
                    `;
                    listEl.appendChild(card);
                });
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            const docBtn = document.getElementById('tabDoctors');
            const clinBtn = document.getElementById('tabClinics');
            const catFilters = document.getElementById('categoryFilters');

            if (tab === 'doctors') {
                docBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-sky-600 text-white transition shadow-sm";
                clinBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-slate-100 text-slate-600 transition";
                catFilters.style.display = 'flex';
            } else {
                clinBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-sky-600 text-white transition shadow-sm";
                docBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-slate-100 text-slate-600 transition";
                catFilters.style.display = 'none';
            }
            renderContent();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.getAttribute('data-cat') === cat) {
                    btn.className = "cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-slate-900 text-white whitespace-nowrap transition";
                } else {
                    btn.className = "cat-btn px-3.5 py-1.5 text-xs font-medium rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition";
                }
            });
            renderContent();
        }

        document.getElementById('searchInput').addEventListener('input', renderContent);

        function openDoctorDetail(doc) {
            const t = translations[currentLang];
            document.getElementById('modalTitle').textContent = doc.name;
            let displayPrice = (doc.price === 0) ? t.free : doc.price;

            const similarDocs = mockDoctors.filter(d => d.category === doc.category && d.id !== doc.id);
            let similarHtml = '';
            if (similarDocs.length > 0) {
                similarHtml = `
                    <div class="mt-4 pt-3 border-t border-slate-100">
                        <h5 class="font-semibold text-xs text-slate-400 uppercase tracking-wider mb-2">${t.similarLabel}</h5>
                        <div class="space-y-2">
                            ${similarDocs.map(sim => `
                                <div onclick="openDoctorDetail(mockDoctors.find(d => d.id === ${sim.id}))" class="flex items-center space-x-2 bg-slate-50 p-2 rounded-xl cursor-pointer hover:bg-sky-50 transition">
                                    <img src="${sim.photo}" class="w-10 h-10 rounded-lg object-cover">
                                    <div class="flex-1 min-w-0">
                                        <p class="text-xs font-bold text-slate-800 truncate">${sim.name}</p>
                                        <p class="text-[10px] text-sky-600 truncate">${sim.subSpecialization}</p>
                                    </div>
                                    <span class="text-xs text-amber-500 font-semibold">★ ${sim.rating}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            let directionsHtml = doc.directions.map(dir => `<span class="bg-sky-50 text-sky-700 px-2.5 py-1 rounded-lg text-xs font-medium">${dir}</span>`).join('');
            let reviewsHtml = doc.reviews.map(rev => `
                <div class="bg-slate-50 p-2.5 rounded-xl text-xs space-y-1">
                    <div class="flex justify-between font-bold text-slate-700">
                        <span>${rev.user}</span>
                        <span class="text-amber-500">{'★'.repeat(rev.rating)}</span>
                    </div>
                    <p class="text-slate-600">${rev.text}</p>
                </div>
            `).join('');

            document.getElementById('modalBody').innerHTML = `
                <div class="flex items-center space-x-3 bg-sky-50 p-3 rounded-2xl">
                    <img src="${doc.photo}" class="w-16 h-16 rounded-xl object-cover shadow-xs">
                    <div>
                        <p class="text-xs text-sky-700 font-bold">${doc.subSpecialization}</p>
                        <p class="text-xs text-slate-600 mt-0.5">${doc.experience} ${t.experience} • Reyting: ★ ${doc.rating}</p>
                    </div>
                </div>
                <div>
                    <h5 class="font-semibold text-xs text-slate-400 uppercase tracking-wider mb-1">Ma'lumot</h5>
                    <p class="text-slate-600 text-xs leading-relaxed">${doc.description}</p>
                </div>
                <div>
                    <h5 class="font-semibold text-xs text-slate-400 uppercase tracking-wider mb-1.5">${t.directionsLabel}</h5>
                    <div class="flex flex-wrap gap-1.5">${directionsHtml}</div>
                </div>
                <div>
                    <h5 class="font-semibold text-xs text-slate-400 uppercase tracking-wider mb-1">${t.hoursLabel}</h5>
                    <p class="text-slate-800 text-xs font-medium">🕒 ${doc.hours}</p>
                </div>
                <div>
                    <h5 class="font-semibold text-xs text-slate-400 uppercase tracking-wider mb-1">${t.clinicLabel}</h5>
                    <p class="text-slate-800 text-xs font-medium">📍 ${doc.clinic} (${doc.address})</p>
                </div>
                <div>
                    <h5 class="font-semibold text-xs text-slate-400 uppercase tracking-wider mb-1">${t.priceLabel}</h5>
                    <p class="text-emerald-600 font-bold text-sm">${displayPrice}</p>
                </div>
                <div>
                    <h5 class="font-semibold text-xs text-slate-400 uppercase tracking-wider mb-2">${t.reviewsLabel}</h5>
                    <div class="space-y-2">${reviewsHtml}</div>
                </div>
                ${similarHtml}
                <div class="flex space-x-2 pt-2">
                    <a href="https://yandex.uz/maps/?text=${encodeURIComponent(doc.clinic + ' ' + doc.address)}" target="_blank" class="flex-1 bg-amber-50 hover:bg-amber-100 text-amber-800 py-3 rounded-xl font-semibold text-xs text-center transition flex items-center justify-center space-x-1">
                        <span>🗺️ ${t.mapBtn}</span>
                    </a>
                    <button onclick="bookAppointment('${doc.name}')" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white py-3 rounded-xl font-semibold text-xs transition shadow-sm">
                        ${t.bookBtn}
                    </button>
                </div>
            `;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function openClinicDetail(clinic) {
            const t = translations[currentLang];
            document.getElementById('modalTitle').textContent = clinic.name;

            let directionsHtml = clinic.directions.map(dir => `<span class="bg-sky-50 text-sky-700 px-2.5 py-1 rounded-lg text-xs font-medium">${dir}</span>`).join('');
            let reviewsHtml = clinic.reviews.map(rev => `
                <div class="bg-slate-50 p-2.5 rounded-xl text-xs space-y-1">
                    <div class="flex justify-between font-bold text-slate-700">
                        <span>${rev.user}</span>
                        <span class="text-amber-500">★ ${rev.rating}</span>
                    </div>
                    <p class="text-slate-600">${rev.text}</p>
                </div>
            `).join('');

            let clinicDoctors = mockDoctors.filter(d => d.clinic === clinic.name);
            let doctorsHtml = clinicDoctors.map(doc => `
                <div onclick="openDoctorDetail(mockDoctors.find(d => d.id === ${doc.id}))" class="flex items-center space-x-2 bg-slate-50 p-2 rounded-xl cursor-pointer hover:bg-sky-50 transition">
                    <img src="${doc.photo}" class="w-10 h-10 rounded-lg object-cover">
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-bold text-slate-800 truncate">${doc.name}</p>
                        <p class="text-[10px] text-sky-600 truncate">${doc.subSpecialization}</p>
                    </div>
                    <span class="text-xs text-amber-500 font-semibold">★ ${doc.rating}</span>
                </div>
            `).join('');

            document.getElementById('modalBody').innerHTML = `
                <img src="${clinic.photo}" class="w-full h-40 object-cover rounded-2xl shadow-xs">
                <div>
                    <h5 class="font-semibold text-xs text-slate-400 uppercase tracking-wider mb-1">Ma'lumot</h5>
                    <p class="text-slate-600 text-xs leading-relaxed">${clinic.description}</p>
                </div>
                <div>
                    <h5 class="font-semibold text-xs text-slate-400 uppercase tracking-wider mb-1.5">${t.directionsLabel}</h5>
                    <div class="flex flex-wrap gap-1.5">${directionsHtml}</div>
                </div>
                <div>
                    <h5 class="font-semibold text-xs text-slate-400 uppercase tracking-wider mb-1">Manzil va Aloqa</h5>
                    <p class="text-slate-800 text-xs font-medium">📍 ${clinic.address}</p>
                    <p class="text-sky-600 text-xs font-medium mt-1">📞 ${clinic.phone}</p>
                </div>
                <div>
                    <h5 class="font-semibold text-xs text-slate-400 uppercase tracking-wider mb-1">${t.hoursLabel}</h5>
                    <p class="text-slate-800 text-xs font-medium">🕒 ${clinic.hours}</p>
                </div>
                <div>
                    <h5 class="font-semibold text-xs text-slate-400 uppercase tracking-wider mb-2">${t.doctorsLabel}</h5>
                    <div class="space-y-2">${doctorsHtml}</div>
                </div>
                <div>
                    <h5 class="font-semibold text-xs text-slate-400 uppercase tracking-wider mb-2">${t.reviewsLabel}</h5>
                    <div class="space-y-2">${reviewsHtml}</div>
                </div>
                <div class="pt-2">
                    <a href="https://yandex.uz/maps/?text=${encodeURIComponent(clinic.name + ' ' + clinic.address)}" target="_blank" class="w-full bg-amber-50 hover:bg-amber-100 text-amber-800 py-3 rounded-xl font-semibold text-xs text-center transition flex items-center justify-center space-x-1 block">
                        <span>🗺️ ${t.mapBtn}</span>
                    </a>
                </div>
            `;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function bookAppointment(docName) {
            const t = translations[currentLang];
            alert(`${docName} ${t.bookedAlert}`);
            closeModal();
        }

        changeLang('uz');
    </script>
</body>
</html>
