<!DOCTYPE html>
<html lang="uz" class="light">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- QRCode Generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white pb-20">

    <!-- REGISTRATION MODAL -->

        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 dark:border-slate-700">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-brand-500/10 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>
                <h2 class="text-2xl font-bold">ShifoTop'ga xush kelibsiz</h2>
                <p class="text-slate-500 text-sm mt-1">Davom etish uchun ma'lumotlaringizni kiriting</p>
            </div>
            
            <form id="authForm" class="space-y-4" onsubmit="handleAuth(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Ism va familiyangiz</label>
                    <input type="text" id="regName" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500" placeholder="Masalan: Alisher Valiyev">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Telefon raqam</label>
                    <div class="flex">
                        <span class="inline-flex items-center px-4 rounded-l-xl bg-slate-100 dark:bg-slate-900 border border-r-0 border-slate-200 dark:border-slate-700 text-slate-500 font-medium">+998</span>
                        <input type="tel" id="regPhone" required maxlength="9" class="w-full px-4 py-3 rounded-r-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500" placeholder="901234567">
                    </div>
                </div>
                <!-- Captcha -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Xavfsizlik kodi (Captcha)</label>
                    <div class="flex items-center gap-3">
                        <div id="captchaBox" class="select-none bg-brand-500/10 text-brand-600 font-bold px-4 py-3 rounded-xl tracking-widest text-lg font-mono">4829</div>
                        <input type="text" id="regCaptcha" required maxlength="4" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500 text-center tracking-widest font-mono" placeholder="Kod">
                    </div>
                </div>
                <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/25 transition-all">
                    Tasdiqlash va kirish
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN HEADER -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-600 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none tracking-tight">Shifo<span class="text-brand-600">Top</span></h1>
                    <span class="text-[10px] text-slate-500 dark:text-slate-400 font-medium tracking-wide">TIBBIYOT PORTALI</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Language Switcher -->
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-100 dark:bg-slate-800 text-xs font-medium px-2.5 py-1.5 rounded-lg border-none focus:ring-0">
                    <option value="uz">O'zbek</option>
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
                <!-- Theme Toggle -->
                <button onclick="toggleTheme()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
                <!-- User Profile / Favorites Trigger -->
                <button onclick="openFavorites()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 relative">
                    <i class="fa-solid fa-bookmark"></i>
                    <span id="favBadge" class="absolute -top-1 -right-1 w-4 h-4 bg-brand-600 text-white text-[10px] rounded-full flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENT CONTAINER -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
        
        <!-- SEARCH & REGION FILTER -->
        <div class="mb-6 space-y-3">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterData()" placeholder="Mutaxassislik, shifokor yoki klinika nomini kiriting..." class="w-full pl-11 pr-4 py-3 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm focus:outline-none focus:border-brand-500 text-sm">
            </div>

            <!-- Regions Horizontal Scroll -->
            <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1" id="regionFilter">
                <button onclick="setRegion('all')" class="region-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap bg-brand-600 text-white shadow-sm transition-all">Barcha hududlar</button>
                <button onclick="setRegion('Toshkent')" class="region-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">Toshkent sh.</button>
                <button onclick="setRegion('Samarqand')" class="region-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">Samarqand</button>
                <button onclick="setRegion('Buxoro')" class="region-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">Buxoro</button>
                <button onclick="setRegion('Fargona')" class="region-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">Farg'ona</button>
            </div>
        </div>

        <!-- MAIN TABS -->
        <div class="flex border-b border-slate-200 dark:border-slate-800 mb-6 gap-6">
            <button onclick="switchTab('doctors')" id="tabDoctors" class="pb-3 text-sm font-bold border-b-2 border-brand-600 text-brand-600 transition-all flex items-center gap-2">
                <i class="fa-solid fa-user-doctor"></i> Shifokorlar
            </button>
            <button onclick="switchTab('clinics')" id="tabClinics" class="pb-3 text-sm font-semibold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2">
                <i class="fa-solid fa-hospital"></i> Klinikalar
            </button>
            <button onclick="switchTab('pharmacy')" id="tabPharmacy" class="pb-3 text-sm font-semibold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2">
                <i class="fa-solid fa-pills"></i> Med-magazin
            </button>
        </div>

        <!-- DYNAMIC CARDS CONTAINER -->
        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Cards will be injected via JS -->
        </div>

        <!-- ADD NEW BUTTON TRIGGER (Floating or Fixed) -->
        <div class="mt-8 text-center">
            <button onclick="openAddModal()" class="inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-brand-50 dark:bg-brand-500/10 text-brand-600 font-semibold hover:bg-brand-100 transition-all text-sm">
                <i class="fa-solid fa-plus-circle"></i> O'z shifokoringiz yoki klinakangizni qo'shing
            </button>
        </div>

    </main>

    <!-- DETAILED VIEW MODAL -->
    <div id="detailModal" class="fixed inset-0 z-40 bg-slate-900/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white dark:bg-slate-800 w-full max-w-2xl rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100 dark:border-slate-700 flex flex-col">
            <div class="sticky top-0 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between z-10">
                <h3 id="detailTitle" class="font-bold text-lg">Ma'lumot</h3>
                <button onclick="closeDetailModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-500 hover:bg-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="detailContent" class="p-6 space-y-6 flex-1">
                <!-- Detailed content injected dynamically -->
            </div>
        </div>
    </div>

    <!-- BOOKING MODAL -->
    <div id="bookingModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">Qabulga yozilish</h3>
                <button onclick="closeBookingModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="bookingForm" onsubmit="submitBooking(event)" class="space-y-4">
                <input type="hidden" id="bookDoctorName">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Mutaxassis</label>
                    <input type="text" id="bookDoctorDisplay" disabled class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Sana</label>
                    <input type="date" id="bookDate" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Vaqt</label>
                    <select id="bookTime" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm">
                        <option value="09:00">09:00 - 10:00</option>
                        <option value="11:00">11:00 - 12:00</option>
                        <option value="14:00">14:00 - 15:00</option>
                        <option value="16:00">16:00 - 17:00</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/25 transition-all text-sm">
                    Ariza yuborish
                </button>
            </form>
        </div>
    </div>

    <!-- ADD NEW ITEM MODAL -->
    <div id="addItemModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 dark:border-slate-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">Yangi obyekt qo'shish</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="addItemForm" onsubmit="submitNewItem(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Bo'limni tanlang</label>
                    <select id="addType" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm">
                        <option value="doctors">Shifokor</option>
                        <option value="clinics">Klinika</option>
                        <option value="pharmacy">Med-magazin</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Nomi (Ismi va familiyasi)</label>
                    <input type="text" id="addName" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm" placeholder="Masalan: Dr. Anvar Karimov">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Mutaxassisligi / Tavsif</label>
                    <input type="text" id="addSpecialty" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm" placeholder="Masalan: Kardiolog / Stomatolog">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Hudud</label>
                    <select id="addRegion" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm">
                        <option value="Toshkent">Toshkent sh.</option>
                        <option value="Samarqand">Samarqand</option>
                        <option value="Buxoro">Buxoro</option>
                        <option value="Fargona">Farg'ona</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Ish tajribasi / Narxi</label>
                    <input type="text" id="addMeta" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm" placeholder="10 yil tajriba / 100,000 so'm">
                </div>
                <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/25 transition-all text-sm">
                    Qo'shish va yuborish
                </button>
            </form>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION FOR TELEGRAM APP EXPERIENCE -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 z-30">
        <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-around">
            <button onclick="switchTab('doctors')" class="nav-item flex flex-col items-center gap-1 text-brand-600" data-target="doctors">
                <i class="fa-solid fa-user-doctor text-lg"></i>
                <span class="text-[10px] font-semibold">Shifokorlar</span>
            </button>
            <button onclick="switchTab('clinics')" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600" data-target="clinics">
                <i class="fa-solid fa-hospital text-lg"></i>
                <span class="text-[10px] font-semibold">Klinikalar</span>
            </button>
            <button onclick="switchTab('pharmacy')" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600" data-target="pharmacy">
                <i class="fa-solid fa-pills text-lg"></i>
                <span class="text-[10px] font-semibold">Dorixona</span>
            </button>
            <button onclick="openAddModal()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-circle-plus text-lg"></i>
                <span class="text-[10px] font-semibold">Qo'shish</span>
            </button>
        </div>
    </nav>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // TELEGRAM WEB APP INIT
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // DATABASE MOCK
        const db = {
            doctors: [
                { id: 1, name: "Dr. Alisher Valiyev", specialty: "Kardiolog", region: "Toshkent", exp: "12 yil", price: "150,000 so'm", rating: 4.9, reviewsCount: 48, clinic: "Shifo Med Clinic", address: "Toshkent sh., Chilonzor 9-mavze", mapUrl: "https://yandex.uz/maps", img: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=150&auto=format&fit=crop&q=80", gallery: ["https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?w=300&auto=format&fit=crop&q=80", "https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=300&auto=format&fit=crop&q=80"], reviews: [{name: "Malika S.", text: "Juda malakali shifokor, tavsiya qilaman!", rating: 5}] },
                { id: 2, name: "Dr. Dilshodbek Rahimov", specialty: "Neuropatolog", region: "Samarqand", exp: "8 yil", price: "120,000 so'm", rating: 4.7, reviewsCount: 31, clinic: "Samarqand Med", address: "Samarqand sh., Registon ko'chasi 12", mapUrl: "https://yandex.uz/maps", img: "https://images.unsplash.com/photo-1537368910025-700350fe46c7?w=150&auto=format&fit=crop&q=80", gallery: ["https://images.unsplash.com/photo-1516549655169-df83a0774514?w=300&auto=format&fit=crop&q=80"], reviews: [{name: "Jasur O.", text: "Menga yordami tegdi, rahmat.", rating: 4}] },
                { id: 3, name: "Dr. Zulfiya Karimova", specialty: "Pediatr", region: "Toshkent", exp: "15 yil", price: "100,000 so'm", rating: 4.9, reviewsCount: 64, clinic: "Bolajon shifo", address: "Toshkent sh., Yunusobod 4", mapUrl: "https://yandex.uz/maps", img: "https://images.unsplash.com/photo-1594824813571-196d42171120?w=150&auto=format&fit=crop&q=80", gallery: [], reviews: [] },
                { id: 4, name: "Dr. Jamshidbek Tursunov", specialty: "Stomatolog", region: "Buxoro", exp: "10 yil", price: "200,000 so'm", rating: 4.8, reviewsCount: 22, clinic: "Buxoro Dental", address: "Buxoro sh., M. Iqbal ko'chasi", mapUrl: "https://yandex.uz/maps", img: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=150&auto=format&fit=crop&q=80", gallery: [], reviews: [] }
            ],
            clinics: [
                { id: 101, name: "Shifo Med Clinic", specialty: "Ko'p tarmoqli tibbiyot markazi", region: "Toshkent", exp: "24/7", price: "O'rtacha", rating: 4.9, reviewsCount: 120, address: "Toshkent sh., Chilonzor 9", mapUrl: "https://yandex.uz/maps", img: "https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=150&auto=format&fit=crop&q=80", gallery: [], reviews: [] },
                { id: 102, name: "MedLife Samarqand", specialty: "Diagnostika va Laboratoriya", region: "Samarqand", exp: "08:00 - 20:00", price: "Hamyonbop", rating: 4.6, reviewsCount: 45, address: "Samarqand sh., Universitet xiyoboni", mapUrl: "https://yandex.uz/maps", img: "https://images.unsplash.com/photo-1586773860418-d37222d8fce3?w=150&auto=format&fit=crop&q=80", gallery: [], reviews: [] }
            ],
            pharmacy: [
                { id: 201, name: "Ateka Dorixonasi", specialty: "Arzon dori-darmonlar va tibbiy jihozlar", region: "Toshkent", exp: "24/7", price: "Yetkazib berish bor", rating: 4.8, reviewsCount: 89, address: "Toshkent sh., Amir Temur ko'chasi 45", mapUrl: "https://yandex.uz/maps", img: "https://images.unsplash.com/photo-1576602976047-174e57a47881?w=150&auto=format&fit=crop&q=80", gallery: [], reviews: [] },
                { id: 202, name: "Ovoza Farm", specialty: "Vitaminlar va tabiiy mahsulotlar", region: "Fargona", exp: "08:00 - 22:00", price: "Chegirmalar mavjud", rating: 4.7, reviewsCount: 34, address: "Farg'ona sh., Markaziy ko'cha", mapUrl: "https://yandex.uz/maps", img: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=150&auto=format&fit=crop&q=80", gallery: [], reviews: [] }
            ]
        };

        let currentTab = 'doctors';
        let currentRegion = 'all';
        let favorites = JSON.parse(localStorage.getItem('shifo_fav')) || [];

        // INITIALIZATION
        window.onload = () => {
            checkAuth();
            renderCards();
            updateFavBadge();
            generateCaptcha();
        };

        // AUTH SYSTEM
        function checkAuth() {
            let user = localStorage.getItem('shifo_user');
            if (!user) {
                document.getElementById('authModal').classList.remove('hidden');
            }
        }

        let generatedCaptchaCode = "4829";
        function generateCaptcha() {
            const num = Math.floor(1000 + Math.random() * 9000);
            generatedCaptchaCode = num.toString();
            document.getElementById('captchaBox').innerText = generatedCaptchaCode;
        }

        function handleAuth(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const captcha = document.getElementById('regCaptcha').value;

            if (captcha !== generatedCaptchaCode) {
                alert("Xavfsizlik kodi noto'g'ri kiritildi!");
                generateCaptcha();
                return;
            }

            if (phone.length !== 9) {
                alert("Telefon raqam 9 ta raqamdan iborat bo'lishi kerak!");
                return;
            }

            const userData = { name, phone: "+998" + phone };
            localStorage.setItem('shifo_user', JSON.stringify(userData));
            document.getElementById('authModal').classList.add('hidden');
            
            if(tg && tg.showAlert) {
                tg.showAlert("Xush kelibsiz, " + name + "!");
            }
        }

        // TAB SWITCHING
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('#tabDoctors, #tabClinics, #tabPharmacy').forEach(el => {
                el.className = "pb-3 text-sm font-semibold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2";
            });
            
            const activeTabMap = {
                'doctors': 'tabDoctors',
                'clinics': 'tabClinics',
                'pharmacy': 'tabPharmacy'
            };

            const activeBtn = document.getElementById(activeTabMap[tab]);
            if(activeBtn) {
                activeBtn.className = "pb-3 text-sm font-bold border-b-2 border-brand-600 text-brand-600 transition-all flex items-center gap-2";
            }

            // Update bottom nav
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('text-brand-600');
                el.classList.add('text-slate-400');
                if(el.getAttribute('data-target') === tab) {
                    el.classList.add('text-brand-600');
                    el.classList.remove('text-slate-400');
                }
            });

            renderCards();
        }

        // REGION FILTER
        function setRegion(region) {
            currentRegion = region;
            document.querySelectorAll('.region-btn').forEach(btn => {
                btn.className = "region-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700";
            });
            event.target.className = "region-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap bg-brand-600 text-white shadow-sm transition-all";
            renderCards();
        }

        // RENDER CARDS
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            
            let items = db[currentTab] || [];
            
            // Filter by region
            if (currentRegion !== 'all') {
                items = items.filter(i => i.region === currentRegion);
            }

            // Filter by search
            if (searchVal.trim() !== '') {
                items = items.filter(i => i.name.toLowerCase().includes(searchVal) || i.specialty.toLowerCase().includes(searchVal) || i.region.toLowerCase().includes(searchVal));
            }

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center">
                        <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <h4 class="font-bold text-slate-600 dark:text-slate-300">Ma'lumot topilmadi</h4>
                        <p class="text-xs text-slate-400 mt-1">Qidiruv shartini o'zgartirib ko'ring yoki yangi obyekt qo'shing.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(item => {
                const isFav = favorites.includes(item.id);
                return `
                    <div onclick="openDetail(${item.id}, '${currentTab}')" class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition-all cursor-pointer flex gap-4 relative group">
                        <img src="${item.img}" alt="${item.name}" class="w-20 h-20 rounded-xl object-cover bg-slate-100 dark:bg-slate-900 shrink-0">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-start justify-between">
                                <h4 class="font-bold text-base truncate pr-6">${item.name}</h4>
                                <button onclick="toggleFav(event, ${item.id})" class="absolute top-4 right-4 text-slate-300 hover:text-rose-500 transition-colors ${isFav ? 'text-rose-500' : ''}">
                                    <i class="fa-solid fa-bookmark"></i>
                                </button>
                            </div>
                            <p class="text-xs font-medium text-brand-600 mt-0.5">${item.specialty}</p>
                            <div class="flex items-center gap-3 mt-3 text-xs text-slate-500 dark:text-slate-400">
                                <span class="flex items-center gap-1"><i class="fa-solid fa-location-dot text-slate-400"></i> ${item.region}</span>
                                <span class="flex items-center gap-1"><i class="fa-solid fa-star text-amber-400"></i> ${item.rating} (${item.reviewsCount})</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // FILTER EVENT
        function filterData() {
            renderCards();
        }

        // FAVORITES SYSTEM
        function toggleFav(e, id) {
            e.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('shifo_fav', JSON.stringify(favorites));
            updateFavBadge();
            renderCards();
        }

        function updateFavBadge() {
            const badge = document.getElementById('favBadge');
            if (favorites.length > 0) {
                badge.innerText = favorites.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function openFavorites() {
            currentRegion = 'all';
            // Show only favorites across categories
            const container = document.getElementById('cardsContainer');
            let allItems = [...db.doctors, ...db.clinics, ...db.pharmacy];
            let items = allItems.filter(i => favorites.includes(i.id));

            if (items.length === 0) {
                alert("Saralanganlar ro'yxati bo'sh!");
                return;
            }

            container.innerHTML = items.map(item => `
                <div onclick="openDetail(${item.id}, 'doctors')" class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 shadow-sm cursor-pointer flex gap-4 relative">
                    <img src="${item.img}" class="w-20 h-20 rounded-xl object-cover bg-slate-100 shrink-0">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-base truncate">${item.name}</h4>
                        <p class="text-xs font-medium text-brand-600 mt-0.5">${item.specialty}</p>
                        <div class="flex items-center gap-3 mt-3 text-xs text-slate-500">
                            <span><i class="fa-solid fa-location-dot"></i> ${item.region}</span>
                            <span><i class="fa-solid fa-star text-amber-400"></i> ${item.rating}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // DETAIL VIEW MODAL
        function openDetail(id, category) {
            // Find item in any category if not strictly matching
            let allItems = [...db.doctors, ...db.clinics, ...db.pharmacy];
            let item = allItems.find(i => i.id === id);
            if (!item) return;

            document.getElementById('detailTitle').innerText = item.name;
            
            let galleryHTML = '';
            if (item.gallery && item.gallery.length > 0) {
                galleryHTML = `
                    <div>
                        <h5 class="text-xs font-semibold text-slate-400 uppercase mb-2">Galereya</h5>
                        <div class="flex gap-2 overflow-x-auto">
                            ${item.gallery.map((img, idx) => `
                                <div class="relative shrink-0">
                                    <img src="${img}" class="w-24 h-24 rounded-xl object-cover">
                                    <button onclick="deletePhoto(${item.id}, ${idx})" class="absolute top-1 right-1 bg-rose-500 text-white w-5 h-5 rounded-full text-[10px] flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                            `).join('')}
                            <label class="w-24 h-24 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 flex flex-col items-center justify-center cursor-pointer text-slate-400 hover:text-brand-600">
                                <i class="fa-solid fa-plus text-lg"></i>
                                <span class="text-[10px] mt-1">Rasm qo'shish</span>
                                <input type="file" accept="image/*" class="hidden" onchange="addPhoto(event, ${item.id})">
                            </label>
                        </div>
                    </div>
                `;
            } else {
                galleryHTML = `
                    <div>
                        <h5 class="text-xs font-semibold text-slate-400 uppercase mb-2">Galereya</h5>
                        <label class="w-full h-20 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 flex items-center justify-center cursor-pointer text-slate-400 hover:text-brand-600 gap-2">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span class="text-xs">Rasm yuklash yoki qo'shish</span>
                            <input type="file" accept="image/*" class="hidden" onchange="addPhoto(event, ${item.id})">
                        </label>
                    </div>
                `;
            }

            document.getElementById('detailContent').innerHTML = `
                <div class="flex gap-4 items-center">
                    <img src="${item.img}" class="w-24 h-24 rounded-2xl object-cover shadow-md">
                    <div>
                        <h4 class="font-bold text-xl">${item.name}</h4>
                        <p class="text-sm font-semibold text-brand-600 mt-1">${item.specialty}</p>
                        <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-location-dot"></i> ${item.address || item.region}</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 py-2">
                    <div class="bg-slate-50 dark:bg-slate-900 p-3 rounded-2xl border border-slate-100 dark:border-slate-700">
                        <span class="text-[10px] text-slate-400 uppercase font-semibold">Tajriba / Grafik</span>
                        <p class="font-bold text-sm mt-0.5">${item.exp || 'Mavjud'}</p>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-900 p-3 rounded-2xl border border-slate-100 dark:border-slate-700">
                        <span class="text-[10px] text-slate-400 uppercase font-semibold">Xizmat narxi</span>
                        <p class="font-bold text-sm mt-0.5">${item.price || 'Kelishilgan holda'}</p>
                    </div>
                </div>

                ${galleryHTML}

                <!-- QR CODE SECTION -->
                <div class="bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl border border-slate-100 dark:border-slate-700 text-center">
                    <h5 class="text-xs font-semibold text-slate-400 uppercase mb-3">Mutaxassis QR-kodi</h5>
                    <div id="qrcode" class="flex justify-center bg-white p-3 rounded-xl inline-block mx-auto shadow-sm"></div>
                    <p class="text-[11px] text-slate-400 mt-2">Ushbu kodni skanerlash orqali shifokor profiliga o'ting</p>
                </div>

                <!-- YANDEX MAP LINK -->
                <div class="flex gap-3">
                    <a href="${item.mapUrl}" target="_blank" class="flex-1 py-3 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-center font-semibold rounded-xl text-sm transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-map-location-dot"></i> Yandeks Xaritada ko'rish
                    </a>
                    <button onclick="openBooking('${item.name}')" class="flex-1 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm shadow-lg shadow-brand-500/25 transition-all flex items-center justify-center gap-2">
                        <i class="fa-regular fa-calendar-check"></i> Qabulga yozilish
                    </button>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');

            // Generate QR Code
            setTimeout(() => {
                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById('qrcode'), {
                    text: window.location.href + "?id=" + item.id,
                    width: 120,
                    height: 120
                });
            }, 100);
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // GALLERY ADD/DELETE
        function addPhoto(e, id) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    let allItems = [...db.doctors, ...db.clinics, ...db.pharmacy];
                    let item = allItems.find(i => i.id === id);
                    if(item) {
                        if(!item.gallery) item.gallery = [];
                        item.gallery.push(uploadEvent.target.result);
                        openDetail(id, currentTab);
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function deletePhoto(id, photoIdx) {
            let allItems = [...db.doctors, ...db.clinics, ...db.pharmacy];
            let item = allItems.find(i => i.id === id);
            if(item && item.gallery) {
                item.gallery.splice(photoIdx, 1);
                openDetail(id, currentTab);
            }
        }

        // BOOKING MODAL
        function openBooking(docName) {
            closeDetailModal();
            document.getElementById('bookDoctorName').value = docName;
            document.getElementById('bookDoctorDisplay').value = docName;
            document.getElementById('bookingModal').classList.remove('hidden');
        }

        function closeBookingModal() {
            document.getElementById('bookingModal').classList.add('hidden');
        }

        function submitBooking(e) {
            e.preventDefault();
            const doc = document.getElementById('bookDoctorName').value;
            const date = document.getElementById('bookDate').value;
            const time = document.getElementById('bookTime').value;

            alert(`Siz "${doc}" qabuliga ${date} kuni soat ${time} da yozildingiz! Tez orada operatorimiz bog'lanadi.`);
            closeBookingModal();
        }

        // ADD ITEM MODAL
        function openAddModal() {
            document.getElementById('addItemModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addItemModal').classList.add('hidden');
        }

        function submitNewItem(e) {
            e.preventDefault();
            const type = document.getElementById('addType').value;
            const name = document.getElementById('addName').value;
            const specialty = document.getElementById('addSpecialty').value;
            const region = document.getElementById('addRegion').value;
            const meta = document.getElementById('addMeta').value;

            const newItem = {
                id: Date.now(),
                name,
                specialty,
                region,
                exp: meta,
                price: "Kelishilgan",
                rating: 5.0,
                reviewsCount: 1,
                address: region + " sh.",
                mapUrl: "https://yandex.uz/maps",
                img: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=150&auto=format&fit=crop&q=80",
                gallery: [],
                reviews: []
            };

            db[type].push(newItem);
            closeAddModal();
            alert("Ma'lumot muvaffaqiyatli qo'shildi va moderatsiyaga yuborildi!");
            switchTab(type);
        }

        // THEME TOGGLE
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('shifo_theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('shifo_theme', 'dark');
            }
        }

        // Load saved theme
        if (localStorage.getItem('shifo_theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        // LANGUAGE CHANGE (Mock text localization wrapper)
        function changeLanguage(lang) {
            if(tg && tg.showAlert) {
                tg.showAlert("Til " + lang.toUpperCase() + " ga o'zgartirildi");
            } else {
                console.log("Language changed to:", lang);
            }
        }
    </script>
</body>
</html>
